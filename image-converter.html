
<script>
  "use strict";

  const fileInput = document.getElementById("imageFile");
  const formatInput = document.getElementById("outputFormat");
  const qualityInput = document.getElementById("quality");
  const qualityValue = document.getElementById("qualityValue");
  const convertButton = document.getElementById("convertButton");
  const downloadButton = document.getElementById("downloadButton");
  const statusBox = document.getElementById("status");

  const MAX_FILE_BYTES = 50 * 1024 * 1024;
  const MAX_PIXELS = 50000000;

  let selectedFile = null;
  let imageElement = null;
  let originalUrl = null;
  let convertedUrl = null;
  let convertedBlob = null;
  let outputName = "toolnova-converted.png";

  // Prevent outdated image loading and conversion results.
  let imageLoadVersion = 0;
  let conversionVersion = 0;

  document.getElementById("year").textContent =
    new Date().getFullYear();

  function setStatus(message, type) {
    statusBox.textContent = message;
    statusBox.classList.remove(
      "tool-status-error",
      "tool-status-success"
    );

    if (type === "error") {
      statusBox.classList.add("tool-status-error");
    }

    if (type === "success") {
      statusBox.classList.add("tool-status-success");
    }
  }

  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + " B";

    if (bytes < 1048576) {
      return (bytes / 1024).toFixed(1) + " KB";
    }

    return (bytes / 1048576).toFixed(2) + " MB";
  }

  function getExtension(type) {
    return {
      "image/jpeg": "jpg",
      "image/png": "png",
      "image/webp": "webp"
    }[type];
  }

  function clearResult() {
    conversionVersion++;

    if (convertedUrl) {
      URL.revokeObjectURL(convertedUrl);
    }

    convertedUrl = null;
    convertedBlob = null;

    document.getElementById("convertedPreview")
      .removeAttribute("src");

    document.getElementById("convertedInfo").textContent = "";

    document.getElementById("resultCard")
      .classList.add("hidden");

    downloadButton.classList.add("hidden");

    convertButton.disabled = !imageElement;
  }

  function setControlsEnabled(enabled) {
    formatInput.disabled = !enabled;
    qualityInput.disabled = !enabled;
    convertButton.disabled = !enabled;
  }

  function updateQualityControl() {
    const isPng = formatInput.value === "image/png";

    qualityInput.disabled = !selectedFile || isPng;

    qualityValue.textContent = isPng
      ? "Not used for PNG"
      : qualityInput.value + "%";
  }

  function clearOriginal() {
    if (originalUrl) {
      URL.revokeObjectURL(originalUrl);
    }

    originalUrl = null;

    document.getElementById("originalPreview")
      .removeAttribute("src");

    document.getElementById("originalInfo").textContent = "";

    document.getElementById("originalCard")
      .classList.add("hidden");
  }

  function resetTool() {
    imageLoadVersion++;
    clearResult();
    clearOriginal();

    selectedFile = null;
    imageElement = null;

    setControlsEnabled(false);
  }

  formatInput.addEventListener("change", () => {
    clearResult();
    updateQualityControl();

    setStatus(
      "Output format changed. Select Convert image to create the new file."
    );
  });

  qualityInput.addEventListener("input", () => {
    qualityValue.textContent = qualityInput.value + "%";

    clearResult();

    setStatus(
      "Quality changed. Convert the image again to apply the new setting."
    );
  });

  fileInput.addEventListener("change", () => {
    resetTool();

    const file = fileInput.files && fileInput.files[0]
      ? fileInput.files[0]
      : null;

    if (!file) {
      setStatus("Select an image to get started.");
      return;
    }

    if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
      fileInput.value = "";

      setStatus(
        "Please choose a JPG, PNG or WebP image.",
        "error"
      );

      return;
    }

    if (file.size > MAX_FILE_BYTES) {
      fileInput.value = "";

      setStatus(
        "This image is larger than 50 MB. Please choose a smaller file.",
        "error"
      );

      return;
    }

    selectedFile = file;

    const currentLoadVersion = imageLoadVersion;

    const imageUrl = URL.createObjectURL(file);
    originalUrl = imageUrl;

    const img = new Image();

    setStatus("Loading image. Please wait...");

    img.onload = () => {
      // Ignore old image loading events.
      if (currentLoadVersion !== imageLoadVersion) {
        return;
      }

      if (selectedFile !== file) {
        return;
      }

      const width = img.naturalWidth;
      const height = img.naturalHeight;

      if (
        !width ||
        !height ||
        width > MAX_PIXELS / height
      ) {
        URL.revokeObjectURL(imageUrl);
        originalUrl = null;

        selectedFile = null;
        imageElement = null;
        fileInput.value = "";

        setControlsEnabled(false);

        setStatus(
          "This image is too large to process safely in your browser. Choose an image with 50 megapixels or fewer.",
          "error"
        );

        return;
      }

      imageElement = img;

      document.getElementById("originalPreview").src = imageUrl;

      document.getElementById("originalInfo").textContent =
        `${width} × ${height} px · ${formatBytes(file.size)} · ${file.name}`;

      document.getElementById("originalCard")
        .classList.remove("hidden");

      setControlsEnabled(true);
      updateQualityControl();

      setStatus(
        `Image ready: ${width} × ${height} pixels. Choose an output format and select Convert image.`
      );
    };

    img.onerror = () => {
      // Ignore errors belonging to an older selection.
      if (currentLoadVersion !== imageLoadVersion) {
        return;
      }

      if (originalUrl === imageUrl) {
        URL.revokeObjectURL(imageUrl);
        originalUrl = null;
      }

      selectedFile = null;
      imageElement = null;
      fileInput.value = "";

      setControlsEnabled(false);

      setStatus(
        "This image could not be opened. Please choose another file.",
        "error"
      );
    };

    img.src = imageUrl;
  });

  convertButton.addEventListener("click", () => {
    if (!imageElement || !selectedFile) {
      setStatus("Please choose an image first.", "error");
      return;
    }

    clearResult();

    const currentImage = imageElement;
    const currentFile = selectedFile;
    const currentVersion = conversionVersion;

    const type = formatInput.value;
    const quality = Number(qualityInput.value) / 100;

    const canvas = document.createElement("canvas");

    canvas.width = currentImage.naturalWidth;
    canvas.height = currentImage.naturalHeight;

    const context = canvas.getContext("2d");

    if (!context) {
      setStatus(
        "Your browser could not process this image.",
        "error"
      );

      return;
    }

    try {
      if (type === "image/jpeg") {
        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, canvas.width, canvas.height);
      }

      context.drawImage(currentImage, 0, 0);
    } catch (error) {
      setStatus(
        "Could not process this image. Please try another file.",
        "error"
      );

      return;
    }

    convertButton.disabled = true;

    setStatus("Converting image. Please wait...");

    try {
      canvas.toBlob(blob => {
        // Do not display an outdated conversion result.
        if (currentVersion !== conversionVersion) {
          return;
        }

        if (
          currentFile !== selectedFile ||
          currentImage !== imageElement
        ) {
          return;
        }

        convertButton.disabled = false;

        if (!blob) {
          setStatus(
            "Could not create the converted image. Please try another format.",
            "error"
          );

          return;
        }

        if (blob.type !== type) {
          setStatus(
            "Your browser does not support this output format. Please choose another format.",
            "error"
          );

          return;
        }

        convertedBlob = blob;
        convertedUrl = URL.createObjectURL(blob);

        const extension = getExtension(type);

        const baseName = currentFile.name.replace(/\.[^.]+$/, "");

        outputName = `${baseName}-converted.${extension}`;

        const preview = document.getElementById("convertedPreview");

        preview.src = convertedUrl;

        document.getElementById("convertedInfo").textContent =
          `${canvas.width} × ${canvas.height} px · ${formatBytes(blob.size)} · ${outputName}`;

        document.getElementById("resultCard")
          .classList.remove("hidden");

        downloadButton.classList.remove("hidden");

        setStatus(
          "Conversion complete. Preview the result, then download your image.",
          "success"
        );

      }, type, type === "image/png" ? undefined : quality);

    } catch (error) {
      convertButton.disabled = false;

      setStatus(
        "An error occurred during conversion. Please try again.",
        "error"
      );
    }
  });

  downloadButton.addEventListener("click", () => {
    if (!convertedBlob) {
      setStatus("Please convert an image first.", "error");
      return;
    }

    const url = URL.createObjectURL(convertedBlob);

    const link = document.createElement("a");

    link.href = url;
    link.download = outputName;

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => {
      URL.revokeObjectURL(url);
    }, 30000);
  });

  window.addEventListener("beforeunload", () => {
    if (originalUrl) {
      URL.revokeObjectURL(originalUrl);
    }

    if (convertedUrl) {
      URL.revokeObjectURL(convertedUrl);
    }
  });
</script>
